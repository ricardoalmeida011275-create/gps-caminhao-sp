# Robô dos alertas da CET (interdições, obras, eventos, jogos, manifestações): lê as notícias públicas da CET
# e atualiza alertas-cet.js. Roda sozinho às 6h e às 18h (horário de Brasília). Para rodar na hora: Actions → Alertas CET → Run workflow.
name: Alertas CET
on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: alertas-cet
  cancel-in-progress: false
jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ler alertas da CET
        run: node ferramentas/alertas-cet.mjs
      - name: Guardar se mudou
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "robo-rota-liberada"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alertas-cet.js
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Robô: alertas da CET"
          git pull --rebase || true
          git push
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pages/builds" || true
